    source: https://github.com/cyralinc/terraform-provider-cyral
    version: 4.16.3
    install: 'terraform { required_providers { cyral = { source = "cyralinc/cyral" } } }'
    official: true
    description: Official Cyral Terraform Provider for the Cyral Control Plane API.
  - language: hcl
    registry: terraform
    name: terraform-aws-sidecar-ec2
