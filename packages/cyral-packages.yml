generated: '2026-07-18'
method: searched
source: https://github.com/cyralinc + https://registry.terraform.io/providers/cyralinc/cyral
note: >-
  Cyral was acquired by Varonis (announced 2025-03-17) and cyral.com now redirects
  to Varonis. First-party client tooling remains published on the cyralinc GitHub
  organization and the Terraform Registry. The Cyral Control Plane REST API is
  primarily automated through the official Terraform provider and its supporting
  modules rather than language SDKs.
packages:
