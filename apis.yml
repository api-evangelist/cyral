name: Cyral
description: >-
  Cyral is a data security and governance platform (founded 2018, Milpitas CA;
  acquired by Varonis in March 2025) that provides an agentless, stateless
  data-layer sidecar for monitoring and governing access to data repositories
  such as Snowflake, PostgreSQL, MySQL, MongoDB, Amazon S3, Kafka, and Oracle.
  Cyral was built API-first: its Control Plane exposes a REST API secured with
  OAuth2 client-credentials, fully automatable through the official Cyral
  Terraform provider (cyralinc/cyral) and supporting Terraform modules for AWS,
  Azure, and Okta. Following the Varonis acquisition, cyral.com now redirects to
  Varonis' Database Activity Monitoring product, but the first-party developer
  tooling remains published on the cyralinc GitHub organization and the Terraform
  Registry.
